# Etapa 2 de 2 — Clinic Control em HTTPS.
#
# Este arquivo NÃO é lido daqui: ele vive no conf.d do nginx da stack
# `contactia` (que é um bind-mount, então basta copiar e recarregar):
#   cp deploy/nginx/cliniccontrol.conf ~/contactia/app/deploy/nginx/conf.d/
#   docker compose -f ~/contactia/app/docker-compose.yml exec nginx nginx -t
#   docker compose -f ~/contactia/app/docker-compose.yml exec nginx nginx -s reload
#
# O certificado é uma lineage própria (clinic.control.contactia.com.br), separada
# da de ligações — dá para renovar/revogar um sem mexer no outro.

# Só manda o header Upgrade quando a request realmente é um upgrade. Fixar
# Connection: upgrade em toda request quebra keep-alive com o upstream.
map $http_upgrade $cc_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name clinic.control.contactia.com.br;

    # Renovação do certificado passa por HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name clinic.control.contactia.com.br;

    ssl_certificate     /etc/letsencrypt/live/clinic.control.contactia.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clinic.control.contactia.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Upload de arquivos do Cofre e anexos de tarefa passam por server action.
    client_max_body_size 50m;

    # Assets com hash no nome: imutáveis, o próprio Next já manda Cache-Control.
    location /_next/static/ {
        proxy_pass http://clinic-control:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_valid 200 1y;
    }

    location / {
        proxy_pass http://clinic-control:3000;

        # `Host` precisa ser o domínio público: os ticks dos jobs em background
        # montam a própria URL a partir dele (ver src/lib/tasks/generate-actions.ts).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Sem isto o cookie de sessão (secure) e os ticks montam http:// e quebram.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming de Server Components / Suspense: com buffer o usuário só vê
        # a página quando o render inteiro termina.
        proxy_buffering off;

        # Relatórios e geração de IA são requests longas.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cc_connection_upgrade;
    }
}
