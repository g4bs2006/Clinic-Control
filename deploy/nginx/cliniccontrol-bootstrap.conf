# Etapa 1 de 2 — só HTTP, para o certbot emitir o primeiro certificado.
#
# Copiar para o conf.d do nginx da stack `contactia`:
#   cp deploy/nginx/cliniccontrol-bootstrap.conf \
#      ~/contactia/app/deploy/nginx/conf.d/cliniccontrol.conf
#
# Depois de emitir o certificado, substituir pelo cliniccontrol.conf.
# Não colocar `ssl_certificate` aqui: o nginx se recusa a subir apontando para
# um arquivo que ainda não existe, e isso derrubaria o site de ligações também.

server {
    listen 80;
    server_name cliniccontrol.contactia.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://clinic-control:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
